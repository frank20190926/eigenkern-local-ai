<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 620" width="1320" height="620" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Outfit:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
      .title { font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif; font-weight: 700; fill: #0F172A; }
      .sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; fill: #475569; }
      .mono { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
      .body { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; }
    </style>
    <filter id="paperShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Architectural Canvas -->
  <rect width="1320" height="620" rx="16" fill="#F8FAFC"/>
  <rect x="0.5" y="0.5" width="1319" height="619" rx="15.5" stroke="#CBD5E1"/>

  <!-- Subtle Swiss Technical Grid -->
  <line x1="840" y1="0" x2="840" y2="620" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Left Zone Header: Ihr eigenes Haus (840px wide) -->
  <rect x="28" y="24" width="784" height="44" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
  <circle cx="52" cy="46" r="5" fill="#0D7A5F"/>
  <text x="68" y="51" class="mono" font-size="12" fill="#065F46" letter-spacing="0.06em">SICHERE ZONE: IHR EIGENES HAUS (ORIGINALAKTEN VERLASSEN NIEMALS DAS GEBÄUDE)</text>

  <!-- Right Zone Header: Externe Cloud-KI (424px wide) -->
  <rect x="868" y="24" width="424" height="44" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="892" y="51" class="mono" font-size="12" fill="#475569" letter-spacing="0.06em">EXTERNE CLOUD-KI (SIEHT NUR PLATZHALTER)</text>

  <!-- STEP 1: Physical Document Sheet (Top Left) -->
  <g filter="url(#paperShadow)">
    <rect x="28" y="96" width="340" height="216" rx="12" fill="#FFFFFF" stroke="#DCE3EC" stroke-width="1.5"/>
  </g>
  <rect x="28" y="96" width="340" height="38" rx="12" fill="#F1F5F9"/>
  <rect x="28" y="122" width="340" height="12" fill="#F1F5F9"/>
  <text x="48" y="120" class="mono" font-size="11.5" fill="#0F172A">01 · ORIGINALAKTE IM HAUS</text>
  <text x="238" y="120" class="mono" font-size="11" fill="#0D7A5F">100% LOKAL</text>

  <text x="48" y="162" class="title" font-size="16">Mandantenakte_2026.pdf</text>
  <text x="48" y="182" class="sub" font-size="12.5">Vertraulicher Jahresabschluss · Seite 14</text>

  <rect x="48" y="198" width="300" height="92" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="64" y="222" class="mono" font-size="12" fill="#334155">Mandant: </text>
  <rect x="132" y="209" width="142" height="18" rx="4" fill="#FEE2E2"/>
  <text x="138" y="222" class="mono" font-size="12" fill="#991B1B">Dr. Thomas Weber</text>

  <text x="64" y="246" class="mono" font-size="12" fill="#334155">Standort:</text>
  <rect x="132" y="233" width="156" height="18" rx="4" fill="#FEE2E2"/>
  <text x="138" y="246" class="mono" font-size="12" fill="#991B1B">Musterstr. 14, Lastrup</text>

  <text x="64" y="270" class="mono" font-size="12" fill="#334155">Honorar: </text>
  <rect x="132" y="257" width="118" height="18" rx="4" fill="#FEE2E2"/>
  <text x="138" y="270" class="mono" font-size="12" fill="#991B1B">482.500 EUR</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="368" y1="204" x2="434" y2="204" stroke="#0047BA" stroke-width="2"/>
  <polygon points="432,199 442,204 432,209" fill="#0047BA"/>

  <!-- STEP 2: Der Wächter (Center Appliance Module) -->
  <g filter="url(#paperShadow)">
    <rect x="444" y="96" width="368" height="492" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  </g>
  <rect x="468" y="120" width="320" height="32" rx="6" fill="#0047BA"/>
  <text x="484" y="141" class="mono" font-size="11.5" fill="#FFFFFF" letter-spacing="0.05em">02 · DER WÄCHTER (LOKALE APPLIANCE)</text>

  <text x="468" y="182" class="body" font-size="16" font-weight="700" fill="#FFFFFF">Lokale Zuordnungs-Tabelle</text>
  <text x="468" y="202" class="body" font-size="12.5" fill="#94A3B8">Ersetzt Klarnamen vor Ort durch neutrale Platzhalter.</text>

  <!-- Mapping Card Inside Wächter -->
  <rect x="468" y="218" width="320" height="128" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="486" y="246" class="mono" font-size="12" fill="#FCA5A5">Dr. Thomas Weber</text>
  <text x="628" y="246" class="mono" font-size="12" fill="#64748B">-&gt;</text>
  <rect x="658" y="232" width="112" height="20" rx="4" fill="#064E3B"/>
  <text x="668" y="246" class="mono" font-size="12" fill="#6EE7B7">[PERSON_A]</text>

  <text x="486" y="276" class="mono" font-size="12" fill="#FCA5A5">Lastrup (Musterstr.)</text>
  <text x="628" y="276" class="mono" font-size="12" fill="#64748B">-&gt;</text>
  <rect x="658" y="262" width="112" height="20" rx="4" fill="#064E3B"/>
  <text x="668" y="276" class="mono" font-size="12" fill="#6EE7B7">[ORT_01]</text>

  <text x="486" y="306" class="mono" font-size="12" fill="#FCA5A5">482.500 EUR</text>
  <text x="628" y="306" class="mono" font-size="12" fill="#64748B">-&gt;</text>
  <rect x="658" y="292" width="112" height="20" rx="4" fill="#064E3B"/>
  <text x="668" y="306" class="mono" font-size="12" fill="#6EE7B7">[BETRAG_X]</text>

  <text x="486" y="334" class="mono" font-size="11" fill="#38BDF8">Schlüssel verbleibt zu 100% im Gerät vor Ort</text>

  <!-- Divider inside Wächter -->
  <line x1="468" y1="372" x2="788" y2="372" stroke="#334155" stroke-width="1"/>

  <!-- Step 4 inside Wächter: Re-Identification -->
  <text x="468" y="402" class="mono" font-size="11.5" fill="#34D399" letter-spacing="0.05em">04 · LOKALE RÜCKFÜHRUNG IM HAUS</text>
  <text x="468" y="426" class="body" font-size="15" font-weight="700" fill="#FFFFFF">Antwort wird lokal wieder vervollständigt</text>
  <text x="468" y="446" class="body" font-size="12.5" fill="#94A3B8">Sobald die Antwort der Cloud-KI eintrifft, setzt der</text>
  <text x="468" y="464" class="body" font-size="12.5" fill="#94A3B8">Wächter vor Ort wieder die echten Mandantendaten ein:</text>

  <rect x="468" y="482" width="320" height="82" rx="10" fill="#064E3B" stroke="#059669"/>
  <text x="486" y="512" class="mono" font-size="12.5" fill="#A7F3D0">[PERSON_A]  -&gt;  Dr. Thomas Weber</text>
  <text x="486" y="538" class="mono" font-size="12.5" fill="#A7F3D0">[ORT_01]    -&gt;  Musterstr. 14, Lastrup</text>

  <!-- Arrow 2 -> 3 (Across Security Boundary to Cloud) -->
  <line x1="812" y1="230" x2="884" y2="230" stroke="#0D7A5F" stroke-width="2.5"/>
  <polygon points="882,225 892,230 882,235" fill="#0D7A5F"/>
  <rect x="816" y="192" width="72" height="24" rx="4" fill="#0D7A5F"/>
  <text x="824" y="208" class="mono" font-size="10" fill="#FFFFFF">SCHATTEN</text>

  <!-- STEP 3: Externe Cloud-KI (Right Column) -->
  <g filter="url(#paperShadow)">
    <rect x="894" y="96" width="398" height="492" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <rect x="894" y="96" width="398" height="38" rx="14" fill="#F1F5F9"/>
  <rect x="894" y="122" width="398" height="12" fill="#F1F5F9"/>
  <text x="916" y="120" class="mono" font-size="11.5" fill="#334155">03 · EXTERNE CLOUD-KI (OPTIONAL ZUBUCHBAR)</text>

  <text x="916" y="166" class="title" font-size="17">Arbeitet ausschließlich am Schatten</text>
  <text x="916" y="188" class="sub" font-size="12.5">Empfängt nur neutrale Platzhalter ohne Personenbezug:</text>

  <rect x="916" y="206" width="354" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="934" y="232" class="mono" font-size="11.5" fill="#64748B">EINGANG (SCHATTENKOPIE):</text>
  <text x="934" y="256" class="mono" font-size="12.5" fill="#0F172A">"Prüfe Fristen für [PERSON_A] am</text>
  <text x="934" y="276" class="mono" font-size="12.5" fill="#0F172A">Standort [ORT_01] bei [BETRAG_X]."</text>
  <text x="934" y="304" class="mono" font-size="11" fill="#0D7A5F">Kenntnis echter Mandantennamen: 0%</text>

  <rect x="916" y="346" width="354" height="134" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="934" y="372" class="mono" font-size="11.5" fill="#64748B">ANTWORT DER CLOUD-KI (MIT PLATZHALTERN):</text>
  <text x="934" y="398" class="mono" font-size="12.5" fill="#0F172A">"Für [PERSON_A] in [ORT_01] gilt</text>
  <text x="934" y="418" class="mono" font-size="12.5" fill="#0F172A">bei [BETRAG_X] die Voranmeldung</text>
  <text x="934" y="438" class="mono" font-size="12.5" fill="#0F172A">nach § 18 UStG bis zum 10.11."</text>
  <text x="934" y="464" class="mono" font-size="11" fill="#475569">DSGVO-Schutz &amp; Berufsgeheimnis (§ 203 StGB) gewahrt</text>

  <!-- Arrow 3 -> 4 (Return from Cloud to Wächter) -->
  <line x1="894" y1="518" x2="822" y2="518" stroke="#0047BA" stroke-width="2.5"/>
  <polygon points="824,513 814,518 824,523" fill="#0047BA"/>

  <!-- STEP 5: Final Result in Office (Bottom Left) -->
  <g filter="url(#paperShadow)">
    <rect x="28" y="368" width="340" height="220" rx="12" fill="#FFFFFF" stroke="#0D7A5F" stroke-width="2"/>
  </g>
  <rect x="28" y="368" width="340" height="38" rx="12" fill="#ECFDF5"/>
  <rect x="28" y="394" width="340" height="12" fill="#ECFDF5"/>
  <text x="48" y="392" class="mono" font-size="11.5" fill="#065F46">05 · FERTIGE ANTWORT AN IHREM ARBEITSPLATZ</text>

  <text x="48" y="432" class="title" font-size="16">Klartext inklusive Fundstelle</text>
  <rect x="48" y="446" width="300" height="90" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="64" y="472" class="body" font-size="13" fill="#0F172A">"Für Dr. Thomas Weber in Lastrup</text>
  <text x="64" y="492" class="body" font-size="13" fill="#0F172A">(482.500 EUR) gilt die Frist 10.11."</text>
  <text x="64" y="520" class="mono" font-size="11.5" fill="#0047BA">Quelle: Mandantenakte_2026.pdf · Seite 14</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="444" y1="518" x2="378" y2="518" stroke="#0D7A5F" stroke-width="2.5"/>
  <polygon points="380,513 370,518 380,523" fill="#0D7A5F"/>
</svg>
